; Images are allowed up to 1GB (see ProfileUpdateRequest/StoreResourceRequest).
; post_max_size covers the worst case of one request: 8 gallery images +
; thumbnail + a 50MB download ZIP, all at once.
upload_max_filesize = 1024M
post_max_size = 10240M
memory_limit = 512M
max_execution_time = 1800
max_input_time = 1800

expose_php = Off

opcache.enable = 1
opcache.memory_consumption = 128
opcache.max_accelerated_files = 10000
opcache.validate_timestamps = 1
opcache.revalidate_freq = 2
